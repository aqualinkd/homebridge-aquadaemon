name: Publish Package to npmjs
on:
  release:
    types: [published]
  workflows: ["Publish Release"] # Must match the "name:" field in your other file exactly
    types:
      - completed

  workflow_dispatch: # Allow manual trigger from the Actions tab
jobs:
  build:
    # It's a manual run (workflow_dispatch) OR
    # It's a workflow_run that finished successfully
    if: | 
        github.event_name == 'workflow_dispatch' || 
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    env:
      # Allow the job to proceed despite the Node 20 deprecation
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # Setup .npmrc file to publish to npm
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          #registry-url: 'https://registry.npmjs.org/package/homebridge-aquadaemon'
          registry-url: 'https://registry.npmjs.org' # Tells npm where to auth
      - run: npm ci    
      # FIX: Switch to install to avoid the Node 22 'Exit handler' bug
      #- run: npm install 
      - run: npm publish --provenance --access public

