#
# Don't forget to update compile-assets.yml if you rename this
#
name: "Publish Release"

on:
  workflow_dispatch:
     # This enables the manual "Run workflow" button in the GitHub Actions UI

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Extract and parse the version from package.json
      - name: Parse Version from package.json
        id: get_version
        run: |
          # Use jq to extract the version string directly from package.json
          VERSION=$(jq -r .version package.json)
          echo "Extracted Version: $VERSION"
          
          # Check for semantic versioning (standard releases vs pre-releases)
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "make_latest=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "make_latest=false" >> $GITHUB_OUTPUT
          fi
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # Create the GitHub Release
      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Release ${{ steps.get_version.outputs.version }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: ${{ steps.get_version.outputs.is_prerelease == 'true' }}
          make_latest: ${{ steps.get_version.outputs.make_latest }}
          generate_release_notes: true 
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Save the precise tag name for downstream workflows
      - name: Save Release Tag Context Token
        run: echo "v${{ steps.get_version.outputs.version }}" > release_tag.txt

      - name: Upload Tag Context
        uses: actions/upload-artifact@v4
        with:
          name: upstream-release-tag
          path: release_tag.txt
          retention-days: 1

